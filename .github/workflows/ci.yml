name: Windows checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    name: Core and browser tests
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Core tests
        run: npm test
      - name: Browser tests
        run: npm run test:ui
      - name: Retain failure details
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-details
          path: test-results/
          retention-days: 7

  native:
    name: Native / ${{ matrix.runtime }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Match the SDK available in the last successful Windows run.
          # Floating 8.0.x can resolve before its download is available.
          dotnet-version: '8.0.426'
      - name: Package portable app
        shell: pwsh
        run: ./scripts/package.ps1 -Runtime ${{ matrix.runtime }}
      - name: Retain portable download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Yuta-${{ matrix.runtime }}
          path: release/downloads/*
          if-no-files-found: error
          retention-days: 14
      - name: Run native fixtures
        if: matrix.runtime == 'win-x64'
        shell: pwsh
        run: |
          $zip = Get-ChildItem release/downloads/Yuta-*-win-x64.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath artifacts/package-check
          ./scripts/test-native.ps1 -Runtime win-x64 -Directory artifacts/package-check/Yuta
      - name: Retain fixture result
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-fixture-result
          path: artifacts/package-check/Yuta/self-test.json
          if-no-files-found: ignore
          retention-days: 14
